push.submit.tooltip=变更可以在推送时直接合入。这主要适用于不想进行代码审查、但想使用 Gerrit 的合入策略来处理繁忙分支上的竞争的团队。使用 submit 会创建变更并立即合入，前提是调用者有合入权限。
