// Points Gradle at Google's Maven Central mirror. repo.maven.apache.org answers 429 Too Many Requests in some
// environments, in bursts which come and go within seconds, and Gradle treats a 429 as fatal: it does not fall
// through to the next repository. It belongs to the environment, not to the project: session-start.sh installs
// it into GRADLE_USER_HOME/init.d, elsewhere pass it with -I, and build.gradle stays untouched.
def mirror = 'https://maven-central.storage-download.googleapis.com/maven2'
beforeSettings { settings ->
    settings.pluginManagement.repositories {
        maven { url mirror }
        gradlePluginPortal()
    }
}
beforeProject { project ->
    project.buildscript.repositories { maven { url mirror } }
    project.repositories {
        maven {
            url mirror
            content { // the SDK and the bundled plugins are not on Maven Central
                excludeGroupByRegex 'com\\.jetbrains.*'
                excludeGroupByRegex 'unzipped\\..*'
                excludeGroupByRegex 'org\\.jetbrains\\.intellij.*'
            }
        }
    }
    // drop the frontend that 429s, or those same groups fall through to it
    project.afterEvaluate {
        project.repositories.removeAll { r ->
            r.hasProperty('url') && r.url.toString().contains('repo.maven.apache.org')
        }
    }
}
