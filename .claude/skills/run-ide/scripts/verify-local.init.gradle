// Points runPluginVerifier at an unpacked IDE, such as the one `ide.sh start latest` downloads, instead of the
// release list on jb.gg and a download, for a sandbox which reaches neither. See AGENTS.md.
def ide = System.getenv('VERIFY_IDE')
if (!ide) {
    throw new GradleException('VERIFY_IDE names no unpacked IDE')
}
allprojects {
    afterEvaluate {
        tasks.matching { it.name == 'runPluginVerifier' }.configureEach {
            ideVersions.set([])
            localPaths.add(new File(ide))
        }
    }
}
