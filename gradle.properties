ideaVersion=IC-2020.3.4
latestIdeaVersion=IU-2026.2.3
ijPluginRepoChannel=
downloadIdeaSources=false
version=2.3.0-203
javaVersion=11
org.gradle.caching=true
# No org.gradle.configuration-cache: gradle-intellij-plugin 1.x fails a reused entry with a
# NoSuchFileException for build/tmp/initializeIntelliJPlugin/coroutines-javaagent.jar once build/ is gone.
# Dependabot proposes new versions of the plugin; its own check asks GitHub on every build and prints a long stack
# trace where GitHub cannot be reached.
org.jetbrains.intellij.buildFeature.selfUpdateCheck=false
